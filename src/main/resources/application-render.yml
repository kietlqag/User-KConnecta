# Render production profile — set SPRING_PROFILES_ACTIVE=render on the Web Service.
# Secrets have NO local fallbacks here; configure them in Render Environment.

spring:
  jpa:
    hibernate:
      # KHÔNG dùng update/validate trên Render PostgreSQL: việc Hibernate quét
      # metadata khóa ngoại (getImportedKeys) sinh truy vấn rất nặng làm server
      # Postgres đóng kết nối giữa chừng (EOFException khi khởi động). Schema được
      # quản lý thủ công qua các *SchemaMigrator/*SchemaFix chạy lúc boot.
      ddl-auto: none
  cache:
    type: none

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kconnecta.vercel.app}
  auth:
    cookies:
      # FE (Vercel) và BE (Render) khác domain → cookie phải SameSite=None + Secure.
      secure: true
      same-site: None

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

internal:
  api:
    key: ${INTERNAL_API_KEY}

admin-service:
  internal-key: ${INTERNAL_API_KEY}
