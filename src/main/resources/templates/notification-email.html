<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KConnecta Notification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f9fc;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #2563eb;
            color: #ffffff;
            padding: 32px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 32px;
            color: #334155;
            line-height: 1.6;
        }
        .headline {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 16px;
        }
        .message {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #2563eb;
            margin: 20px 0;
        }
        .footer {
            padding: 20px 32px 32px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>KConnecta</h1>
    </div>
    <div class="content">
        <p>Xin chào <strong>{{recipientName}}</strong>,</p>
        <p class="headline">{{headline}}</p>
        <div class="message">{{content}}</div>
        <p>Đăng nhập KConnecta để xem chi tiết và phản hồi.</p>
    </div>
    <div class="footer">
        Bạn nhận email này vì đã bật thông báo qua email trong cài đặt tài khoản.
    </div>
</div>
</body>
</html>
