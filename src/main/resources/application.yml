spring:
  application:
    name: kconnecta.user.backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # DEPLOY NOTE: schema must match entities. Run `ddl-auto: update` once in dev to align, then switch back.
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    show-sql: false
    open-in-view: false

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  main:
    banner-mode: off

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: none   # safe default - overridden to "redis" only in application-docker.yml

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
      file-size-threshold: 2MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}  # Required — no default. Set JWT_SECRET env var. Local fallback lives in application-local.yml only.
  expiration: ${JWT_EXPIRATION:86400000}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}   # 30 phút — tuổi thọ access token khi dùng refresh token

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

admin-service:
  url: ${ADMIN_SERVICE_URL:http://localhost:8082}
  internal-key: ${INTERNAL_API_KEY}  # Required — no default allowed

internal:
  api:
    key: ${INTERNAL_API_KEY}  # Same key as admin-service.internal-key

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://user-k-connecta.vercel.app}
  auth:
    cookies:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      refresh-max-age-days: 30
  trusted-proxy-ips: ${TRUSTED_PROXY_IPS:}
  search:
    reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:true}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  token-ttl-minutes: ${LIVEKIT_TOKEN_TTL_MINUTES:120}
  egress:
    enabled: ${LIVEKIT_EGRESS_ENABLED:false}
    s3-bucket: ${LIVEKIT_EGRESS_S3_BUCKET:}
    s3-access-key: ${LIVEKIT_EGRESS_S3_ACCESS_KEY:}
    s3-secret: ${LIVEKIT_EGRESS_S3_SECRET:}
      s3-region: ${LIVEKIT_EGRESS_S3_REGION:auto}
    s3-endpoint: ${LIVEKIT_EGRESS_S3_ENDPOINT:}
    public-base-url: ${LIVEKIT_EGRESS_PUBLIC_BASE_URL:}

gemini:
  # Comma-separated API keys — fallback to next key on quota errors (429 / RESOURCE_EXHAUSTED)
  api-keys: ${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
  # Free-tier quota priority high → low (RPD/RPM): 3.1-flash-lite → 2.5-flash-lite → others
  models: ${GEMINI_MODELS:gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash,gemini-3-flash,gemini-3.5-flash}

logging:
  level:
    root: INFO
    com.kconnecta: DEBUG
    org.springframework.mail: WARN
    org.eclipse.angus.mail: WARN
    org.springframework: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
