spring:
  application:
    name: kconnecta.user.backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # DEPLOY NOTE: schema must match entities. Run `ddl-auto: update` once in dev to align, then switch back.
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    show-sql: false
    open-in-view: false

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  main:
    banner-mode: off

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: none   # safe default - overridden to "redis" only in application-docker.yml

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}  # Required — app fails to start if missing
  expiration: ${JWT_EXPIRATION:86400000}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

admin-service:
  url: ${ADMIN_SERVICE_URL:http://localhost:8082}
  internal-key: ${INTERNAL_API_KEY}  # Required — no default allowed

internal:
  api:
    key: ${INTERNAL_API_KEY}  # Same key as admin-service.internal-key

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://user-k-connecta.vercel.app}
  trusted-proxy-ips: ${TRUSTED_PROXY_IPS:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  token-ttl-minutes: ${LIVEKIT_TOKEN_TTL_MINUTES:120}

logging:
  level:
    org.springframework.mail: warn
    org.eclipse.angus.mail: warn
    org.springframework: warn
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
