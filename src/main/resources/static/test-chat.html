<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    body { font-family: monospace; max-width: 800px; margin: 30px auto; padding: 0 20px; }
    h2  { border-bottom: 1px solid #ccc; padding-bottom: 8px; }
    .section { margin-bottom: 24px; }
    label { display: inline-block; width: 120px; font-weight: bold; }
    input  { width: 280px; padding: 4px 6px; margin: 3px 0; }
    button { margin: 6px 4px 0 0; padding: 6px 14px; cursor: pointer; }
    #log   { background: #1e1e1e; color: #d4d4d4; padding: 12px; height: 300px;
             overflow-y: auto; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
    .ok  { color: #4ec9b0; }
    .err { color: #f44747; }
    .msg { color: #dcdcaa; }
    .info{ color: #9cdcfe; }
  </style>
</head>
<body>
<h2>WebSocket Chat Test Client</h2>

<!-- STEP 1: Lấy token -->
<div class="section">
  <h3>1. Lấy JWT Token</h3>
  <label>Backend URL</label>
  <input id="baseUrl" value="http://localhost:8080" /><br/>
  <label>Username</label>
  <input id="username" placeholder="username đã đăng ký" /><br/>
  <button onclick="getToken()">Lấy Token</button>
  <div style="margin-top:8px">
    <label>Token</label>
    <input id="token" placeholder="(tự điền sau khi nhấn Lấy Token)" style="width:440px"/><br/>
    <label>User ID</label>
    <input id="userId" placeholder="(tự điền)" />
  </div>
</div>

<!-- STEP 2: Kết nối WebSocket -->
<div class="section">
  <h3>2. Kết nối WebSocket</h3>
  <button onclick="connect()" id="btnConnect">Connect</button>
  <button onclick="disconnect()" id="btnDisconnect" disabled>Disconnect</button>
</div>

<!-- STEP 3: Gửi tin nhắn -->
<div class="section">
  <h3>3. Gửi tin nhắn</h3>
  <label>Receiver UUID</label>
  <input id="receiverId" placeholder="UUID của người nhận" /><br/>
  <label>Nội dung</label>
  <input id="content" placeholder="Nội dung tin nhắn" /><br/>
  <button onclick="sendMessage()" id="btnSend" disabled>Gửi</button>
</div>

<!-- LOG -->
<div class="section">
  <h3>Log</h3>
  <button onclick="document.getElementById('log').innerHTML=''">Xóa log</button>
  <div id="log"></div>
</div>

<script>
  let stompClient = null;

  function log(msg, cls = '') {
    const el = document.getElementById('log');
    const line = document.createElement('span');
    line.className = cls;
    line.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n';
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  async function getToken() {
    const baseUrl  = document.getElementById('baseUrl').value.trimEnd('/');
    const username = document.getElementById('username').value.trim();
    if (!username) { log('Nhập username trước', 'err'); return; }

    try {
      const res  = await fetch(`${baseUrl}/api/auth/test-token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (!res.ok) { log('Lỗi: ' + JSON.stringify(data), 'err'); return; }

      document.getElementById('token').value  = data.token  || '';
      document.getElementById('userId').value = data.id     || '';
      log(`Token nhận được cho user "${data.username}" (id=${data.id})`, 'ok');
    } catch (e) {
      log('Fetch lỗi: ' + e.message, 'err');
    }
  }

  function connect() {
    const baseUrl = document.getElementById('baseUrl').value.trimEnd('/');
    const token   = document.getElementById('token').value.trim();
    if (!token) { log('Lấy token trước rồi mới connect', 'err'); return; }

    // Chuyển http -> ws, https -> wss
    const wsUrl = baseUrl.replace(/^http/, 'ws') + '/ws';
    log(`Connecting to ${wsUrl} ...`, 'info');

    stompClient = new StompJs.Client({
      brokerURL: wsUrl,
      connectHeaders: {
        Authorization: 'Bearer ' + token
      },
      reconnectDelay: 0,
      onConnect: (frame) => {
        log('Connected: ' + frame.command, 'ok');
        document.getElementById('btnConnect').disabled    = true;
        document.getElementById('btnDisconnect').disabled = false;
        document.getElementById('btnSend').disabled       = false;

        // Subscribe nhận tin nhắn gửi tới mình
        stompClient.subscribe('/user/queue/messages', (msg) => {
          try {
            const body = JSON.parse(msg.body);
            log('Nhận: ' + JSON.stringify(body, null, 2), 'msg');
          } catch {
            log('Nhận (raw): ' + msg.body, 'msg');
          }
        });
        log('Subscribed to /user/queue/messages', 'ok');
      },
      onStompError: (frame) => {
        log('STOMP error: ' + frame.headers?.message, 'err');
      },
      onDisconnect: () => {
        log('Disconnected', 'info');
        document.getElementById('btnConnect').disabled    = false;
        document.getElementById('btnDisconnect').disabled = true;
        document.getElementById('btnSend').disabled       = true;
      },
      onWebSocketError: (e) => {
        log('WebSocket error: ' + e.type, 'err');
      }
    });

    stompClient.activate();
  }

  function disconnect() {
    if (stompClient) {
      stompClient.deactivate();
      stompClient = null;
    }
  }

  function sendMessage() {
    const receiverId = document.getElementById('receiverId').value.trim();
    const content    = document.getElementById('content').value.trim();
    if (!receiverId || !content) { log('Điền receiverId và nội dung', 'err'); return; }
    if (!stompClient?.connected) { log('Chưa connect', 'err'); return; }

    const payload = JSON.stringify({ receiverId, content });
    stompClient.publish({ destination: '/app/chat.private', body: payload });
    log(`Đã gửi → ${receiverId}: "${content}"`, 'info');
  }
</script>
</body>
</html>
