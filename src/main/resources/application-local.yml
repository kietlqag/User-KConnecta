app:
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*,https://user-k-connecta.vercel.app
  search:
    reindex-on-startup: false  # Dev: skip full Redis reindex; use POST /api/search/reindex when needed

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # temporary: adds missing columns (privacy in post_shares); revert to validate after first run
  sql:
    init:
      mode: never  # StoryPrivacySchemaBootstrap + ddl-auto handle schema; skip redundant init on every boot

  datasource:
    hikari:
      # Remote Postgres (e.g. Render) can drop idle SSL sockets; keep connections warm.
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 540000
      keepalive-time: 120000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # Disable Redis caching locally so the app starts even if Redis is not running.
  # @Cacheable / @CachePut / @CacheEvict become no-ops - logic still executes correctly.
  cache:
    type: none

  mail:
    username: ${MAIL_USERNAME:dev@localhost}
    password: ${MAIL_PASSWORD:dev}

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

# Local-only fallbacks when .env keys are missing. Do not rely on these outside `local` profile.
jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-in-production-must-be-at-least-64-chars-long}

admin-service:
  internal-key: ${INTERNAL_API_KEY:local-dev-internal-api-key}

internal:
  api:
    key: ${INTERNAL_API_KEY:local-dev-internal-api-key}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:local}
  api-key: ${CLOUDINARY_API_KEY:local}
  api-secret: ${CLOUDINARY_API_SECRET:local}

# Match docker-compose + livekit.dev.yaml when LiveKit container runs on localhost:7880
livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}
